name: Profile stats (incl. private contributions)

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update_profile_stats.py"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate stats.svg + languages.svg
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}   # classic PAT: read:user + repo
          GH_LOGIN: Jagadish-s-naik
        run: python scripts/update_profile_stats.py
      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile stats"
          git push
